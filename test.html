
<html>
    <head>
        <title>Test Page</title>
        <style>
            *{
                margin: 0;
                overflow: hidden;
            }
        </style>
    </head>
    <body>
        <canvas id="canv">

        



        </canvas>
        <script src = "Vector2.js">  
            
        </script>
        <script>
            let canvas = document.querySelector("#canv");
            let ctx = canvas.getContext("2d");

            let position = new Vector2(20, 50);

            function gameLoop(){
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }

            function update(){
                position.x = position.x + 0.2;
            }

            function draw(){

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            

            ctx.save();

            ctx.translate(position.x, position.y);

           



            ctx.lineTo(0, 0);
            ctx.lineTo(50, 30);
            ctx.lineTo(50, 20);
            ctx.lineTo(60, 0);
            ctx.lineTo(70, 20);
            ctx.lineTo(80, 0);
            ctx.lineTo(90, 20);
            ctx.lineTo(90, 30);
            ctx.lineTo(140, 0);
            ctx.lineTo(140, 50);
            ctx.lineTo(70, 80);
            ctx.lineTo(0, 50);
            ctx.lineTo(0, 0);






            ctx.fillStyle = "black";
            ctx.fill();



            ctx.restore();
            }
            


            requestAnimationFrame(gameLoop);


            
        </script>
    </body>

</html>
